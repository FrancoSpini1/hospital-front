<div class="body">
  <div class="dashboardsettings">
    <p class="tittle">DASHBOARD</p>
    <div class="botoneh">
      <button matButton>Turnos</button>
      <button matButton>Perfil</button>
      <button matButton>Contacto</button>
    </div>
    <button mat-mini-fab class="opciones"><mat-icon>exit_to_app</mat-icon></button>
  </div>

  <div class="turnosContainer">
    <span class="turnosTitulo">Turnos</span>

    <div class="tabla-wrapper">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <!-- Fecha -->
  <ng-container matColumnDef="fecha">
    <th mat-header-cell *matHeaderCellDef> Fecha </th>
    <td mat-cell *matCellDef="let turno">
      {{ turno.fechaTurno }}
    </td>
  </ng-container>

  <!-- Hora -->
  <ng-container matColumnDef="hora">
    <th mat-header-cell *matHeaderCellDef> Hora </th>
    <td mat-cell *matCellDef="let turno">
      {{ turno.horaTurno }}
    </td>
  </ng-container>

  <!-- Paciente -->
  <ng-container matColumnDef="paciente">
    <th mat-header-cell *matHeaderCellDef> Paciente </th>
    <td mat-cell *matCellDef="let turno">
      {{ turno.paciente.nombreCompleto }}
    </td>
  </ng-container>

  <!-- Médico -->
  <ng-container matColumnDef="medico">
    <th mat-header-cell *matHeaderCellDef> Médico </th>
    <td mat-cell *matCellDef="let turno">
      {{ turno.medico.nombreCompleto }}
    </td>
  </ng-container>

  <!-- Especialidad -->
  <ng-container matColumnDef="especialidad">
    <th mat-header-cell *matHeaderCellDef> Especialidad </th>
    <td mat-cell *matCellDef="let turno">
      {{ turno.medico.especialidad }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>      </table>
    </div>
  </div>

  <div class="botonTurnoNuevo">
    <button matFab (click)="hacerTurnoNuevo()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
