
<div class="header">
    <h1 class="title">HOSPITAL</h1>
</div>
<div class="divLogin">
    <h1 style="font-size: 40px;">INICIAR SESION</h1>
    <p style ="font-size:20px">ingresar nombre de usuario</p>
    <mat-form-field>
  <mat-label>usuario</mat-label>
  <input matInput>
</mat-form-field>
<p style="font-size: 20px;">ingresar contraseña</p>
  <mat-form-field>
    <mat-label>Enter your password</mat-label>
    <input matInput [type]="hide() ? 'password' : 'text'" />
    <button
      matIconButton
      matSuffix
      (click)="clickEvent($event)"
      [attr.aria-label]="'Hide password'"
      [attr.aria-pressed]="hide()"
    >
      <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
  </mat-form-field>
    <section>
        <button class="example-button-row" , matButton="filled" >Basic</button>
    </section>
    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
</div>
